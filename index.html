<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Security Center</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Consolas, monospace;
}

#matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    color:#00ff00;
    opacity:0.12;
    font-size:14px;
    pointer-events:none;
    white-space:pre-wrap;
    overflow:hidden;
}

#main{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:10;
}

h1{
    color:red;
    font-size:64px;
    margin-bottom:20px;
    animation:flash .8s infinite;
}

@keyframes flash{
    50%{
        opacity:.3;
    }
}

.warning{
    color:white;
    font-size:26px;
    line-height:1.6;
}

#btc{
    color:#ff4444;
    font-size:32px;
    font-weight:bold;
    margin:20px;
    letter-spacing:3px;
}

#countdown{
    color:yellow;
    font-size:28px;
    margin:15px;
}

input{
    width:500px;
    padding:15px;
    font-size:28px;
    text-align:center;
    background:#111;
    color:#00ff00;
    border:2px solid red;
}

button{
    margin-top:20px;
    padding:15px 40px;
    font-size:24px;
    cursor:pointer;
}

#closeBtn{
    display:none;
    position:fixed;
    right:20px;
    bottom:20px;
    font-size:24px;
    padding:15px 35px;
}

#status{
    color:red;
    font-size:24px;
    margin-top:20px;
}
</style>
</head>

<body>

<div id="matrix"></div>

<div id="main">

<h1>⚠ FILES ENCRYPTED ⚠</h1>

<div class="warning">
KOMPUTERMU TELAH TERENKRIPSI OLEH TROJAN<br><br>

Jangan restart komputer selama 24 jam.<br>
Kamu harus mengirim <b>1000 BITCOIN</b> ke nomor di bawah ini.
</div>

<div id="btc">
0000-0000-0000-0000
</div>

<div id="countdown">
WAKTU TERSISA: 24:00:00
</div>

<input
id="password"
placeholder="MASUKKAN KODE DEKRIPSI">

<br>

<button onclick="checkCode()">
DECRYPT
</button>

<div id="status"></div>

</div>

<button id="closeBtn" onclick="closeApp()">
CLOSE
</button>

<script>

const secret = "admin1234root";

function randomCode(){
    let chars="0123456789ABCDEF";
    let result="";

    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            result+=chars[Math.floor(Math.random()*chars.length)];
        }

        if(i<3) result+="-";
    }

    return result;
}

setInterval(()=>{
    document.getElementById("btc").innerText=randomCode();
},1000);

let total=24*60*60;

setInterval(()=>{
    total--;

    let h=Math.floor(total/3600);
    let m=Math.floor((total%3600)/60);
    let s=total%60;

    document.getElementById("countdown").innerText=
        "WAKTU TERSISA: " +
        String(h).padStart(2,"0")+":"+
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");

},1000);

function checkCode(){

    let value=document
        .getElementById("password")
        .value;

    if(value===secret){

        document.getElementById("status")
            .style.color="#00ff00";

        document.getElementById("status")
            .innerText="ACCESS GRANTED";

        document.getElementById("closeBtn")
            .style.display="block";

    }else{

        document.getElementById("status")
            .style.color="red";

        document.getElementById("status")
            .innerText="INVALID DECRYPTION KEY";
    }
}

function generateBinary(){

    let text="";

    for(let i=0;i<250;i++){

        for(let j=0;j<100;j++){
            text+=Math.random()>0.5?"1":"0";
        }

        text+="\n";
    }

    document.getElementById("matrix")
        .textContent=text;
}

generateBinary();

setInterval(generateBinary,500);

</script>

</body>
</html>
